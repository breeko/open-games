<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101e18">
  <meta name="description" content="An ad-free library of nostalgic favorites and new game experiments. Play in your browser, on desktop or iPad.">
  <title>Open Games · The game library</title>
</head>
<body>
  <header class="site-header"><a class="wordmark" href="/">OPEN<span>GAMES</span><i aria-hidden="true">↗</i></a><span class="header-note">A little time well spent.</span></header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">THE GAME LIBRARY</p>
      <h1 id="page-title">Old favorites. <span>New experiments.</span></h1>
      <p class="intro-copy">Nostalgic favorites and new things to try. Free to play, without the ads.</p>
      <div class="promises"><span><i aria-hidden="true">✦</i> Free to play</span><span><i aria-hidden="true">✦</i> No ads</span><span><i aria-hidden="true">✦</i> No account needed</span></div>
    </section>
    <section class="collection" aria-labelledby="collection-title">
      <div class="collection-heading"><h2 id="collection-title">Find your next game</h2><span id="game-count"></span></div>
      <nav id="categories" aria-label="Game categories"></nav>
      <div id="game-list" class="game-grid"></div>
    </section>
  </main>
  <footer class="site-footer"><span>OPEN GAMES</span><p>Your progress stays in this browser.</p><a href="https://github.com/breeko/open-games" target="_blank" rel="noopener">On GitHub ↗</a></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
